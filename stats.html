<!doctype html>
<html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Správy bez negatív – štatistiky</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#161a1f; --mut:#667085; --line:#e4e7ec; --bad:#dc2626; --good:#16a34a; --mid:#ca8a04; --acc:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151a; --card:#1b2027; --fg:#eef1f5; --mut:#9aa4b2; --line:#2c333d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,"Segoe UI",sans-serif; }
  .wrap { width:100%; max-width:440px; min-width:360px; margin:0 auto; padding:14px; }
  h1 { font-size:17px; margin:0; }
  .sub { color:var(--mut); font-size:12px; margin:2px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; padding:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; cursor:pointer; font:inherit; }
  .tabs button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .verdict { font-size:15px; font-weight:600; }
  .patients { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .pat { border:1px solid var(--line); border-radius:10px; padding:10px 8px; text-align:center; }
  .pat .face { font-size:40px; line-height:1.1; }
  .pat .lbl { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
  .pat .title { font-weight:600; margin:2px 0; font-size:13px; }
  .hearts { font-size:15px; letter-spacing:1px; margin:4px 0; }
  .bar { height:9px; border-radius:6px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:6px; transition:width .6s; }
  .hp { font-size:12px; color:var(--mut); margin-top:3px; }
  .pat.without { background:rgba(220,38,38,.07); }
  .pat.with { background:rgba(22,163,74,.08); }
  .pulse { display:inline-block; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform:scale(1.18); } }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tile { border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .tile b { display:block; font-size:22px; line-height:1.15; }
  .tile span { color:var(--mut); font-size:12px; }
  h2 { font-size:13px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); }
  .split { display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--line); }
  .split i { display:block; height:100%; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:12px; color:var(--mut); }
  .chart { display:flex; align-items:flex-end; gap:3px; height:70px; }
  .chart div { flex:1; background:var(--bad); border-radius:3px 3px 0 0; min-height:2px; opacity:.85; }
  .chart div.zero { background:var(--line); }
  .axis { display:flex; justify-content:space-between; font-size:10px; color:var(--mut); margin-top:2px; }
  .empty { text-align:center; padding:18px 8px; color:var(--mut); }
  .foot { display:flex; justify-content:space-between; gap:8px; align-items:center; color:var(--mut); font-size:11px; }
  .foot button { font:inherit; font-size:11px; background:none; border:1px solid var(--line); color:var(--mut); border-radius:6px; padding:3px 8px; cursor:pointer; }
  a { color:var(--acc); }
</style></head>
<body><div class="wrap">
  <h1>☀️ Správy bez negatív</h1>
  <div class="sub" id="since">…</div>
  <div class="tabs" id="tabs">
    <button data-r="1" class="on">Dnes</button><button data-r="7">7 dní</button><button data-r="0">Od začiatku</button>
  </div>
  <div id="app"></div>
  <div class="card foot" id="diagcard"><span id="diag"></span></div>
  <div class="card foot">
    <span><a href="options.html" target="_blank">Nastavenia</a> · hodnoty sú orientačné odhady</span>
    <button id="reset" title="Vymaže log hodnotení (nie kľúč)">Zmazať štatistiky</button>
  </div>
</div>
<script src="stats.js"></script>
</body></html>
